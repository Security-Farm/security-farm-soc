---
- name: Setup DFIR-IRIS
  hosts: "{{ iris_hosts }}"
  become: yes

  pre_tasks:
    - fail:
        msg: "Please pass the appropriate vars file with -e @/path/to/file.yml"
      when: iris_vars_exist is undefined

  tasks:
    - name: Install system_base
      include_role:
        name: system_base
      tags: [system_base]

    - name: Install iris
      include_role:
        name: iris-redhat
      tags: [iris]